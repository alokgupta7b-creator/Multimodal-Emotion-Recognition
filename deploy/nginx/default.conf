server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match backend 50 MB media upload limit (+ multipart framing overhead)
    client_max_body_size 52m;

    # Static SPA security headers (re-included in child locations that declare add_header)
    include /etc/nginx/security_headers.inc;

    # Lightweight health check for load balancers / Docker
    location = /healthz {
        access_log off;
        include /etc/nginx/security_headers.inc;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin proxy when running bundled Docker Compose with VITE_API_BASE_URL=/api
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_target http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # Long-term immutable cache for hashed Vite static assets
    location /assets/ {
        expires 30d;
        include /etc/nginx/security_headers.inc;
        add_header Cache-Control "public, immutable";
    }

    # Never cache SPA shell so API URL / asset updates roll out immediately
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security_headers.inc;
        add_header Cache-Control "no-cache";
    }
}
