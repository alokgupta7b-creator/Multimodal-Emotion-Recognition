# Staging stack for Multimodal Emotion Recognition
# Launch local container smoke test:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging.example up --build -d
# Enable HTTPS reverse proxy on a DNS-pointed staging host:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging --profile tls up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: emotion-studio-backend:staging
    restart: unless-stopped
    environment:
      EMOTION_API_ENV: ${EMOTION_API_ENV:-staging}
      EMOTION_API_HOST: 0.0.0.0
      EMOTION_API_PORT: 8000
      EMOTION_API_MODEL_ROOT: /app/models
      EMOTION_API_DEVICE: ${EMOTION_API_DEVICE:-cpu}
      EMOTION_API_FACIAL_BACKEND: ${EMOTION_API_FACIAL_BACKEND:-resnet18}
      EMOTION_API_FACIAL_POOLING: ${EMOTION_API_FACIAL_POOLING:-raw_all_detections_mean_prob}
      EMOTION_API_FACIAL_STRICT_FP32: ${EMOTION_API_FACIAL_STRICT_FP32:-1}
      EMOTION_API_VIDEO_SHA256: ${EMOTION_API_VIDEO_SHA256:-8825d865c70351a38c1da1448d9b6c087a0fe090ad586851edf0342fc4761b64}
      EMOTION_API_VIDEO_FALLBACK_SHA256: ${EMOTION_API_VIDEO_FALLBACK_SHA256:-4830ac8409e73da149b4eaf169679f2c2b95322316a411751f0567ac478bc9b0}
      EMOTION_API_MAX_UPLOAD_BYTES: ${EMOTION_API_MAX_UPLOAD_BYTES:-52428800}
      EMOTION_API_MAX_VIDEO_SECONDS: ${EMOTION_API_MAX_VIDEO_SECONDS:-60}
      EMOTION_API_MAX_TEXT_CHARS: ${EMOTION_API_MAX_TEXT_CHARS:-20000}
      EMOTION_API_REQUEST_TIMEOUT_SECONDS: ${EMOTION_API_REQUEST_TIMEOUT_SECONDS:-60}
      EMOTION_API_OPTIMIZED_VIDEO_PIPELINE: ${EMOTION_API_OPTIMIZED_VIDEO_PIPELINE:-1}
      EMOTION_API_FAIL_ON_MISSING_MODELS: ${EMOTION_API_FAIL_ON_MISSING_MODELS:-1}
      EMOTION_API_ALLOWED_ORIGINS: ${EMOTION_API_ALLOWED_ORIGINS:-http://localhost:8080}
      EMOTION_API_ENABLE_DOCS: ${EMOTION_API_ENABLE_DOCS:-0}
      EMOTION_API_RATE_LIMIT_REQUESTS: ${EMOTION_API_RATE_LIMIT_REQUESTS:-120}
      EMOTION_API_RATE_LIMIT_WINDOW_SECONDS: ${EMOTION_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      EMOTION_API_LOG_LEVEL: ${EMOTION_API_LOG_LEVEL:-INFO}
      KMP_DUPLICATE_LIB_OK: "TRUE"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-only runtime checkpoints (~703 MiB); switch source to ./staging_models_bundle if pruned
      - ./models/text_emotion/distilbert/best:/app/models/text_emotion/distilbert/best:ro
      - ./models/speech_emotion/wav2vec2/best:/app/models/speech_emotion/wav2vec2/best:ro
      - ./models/facial_emotion:/app/models/facial_emotion:ro
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: emotion-studio-frontend:staging
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2.9-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.example.invalid}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:-api-staging.example.invalid}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/json/emotion-studio.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
